name: CI

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]
  # Ejecución manual: permite correr también las pruebas E2E.
  workflow_dispatch:
    inputs:
      e2e:
        description: "Ejecutar pruebas E2E contra el backend configurado en los secrets"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Calidad: lint, tipos, pruebas unitarias (caja blanca) y build ──────────
  verify:
    name: Lint, tipos, pruebas unitarias y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Pruebas unitarias con cobertura (Vitest)
        run: npm run test:coverage

      - name: Resumen de cobertura
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k, label) => `| ${label} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log([
              "### Cobertura de pruebas unitarias",
              "| Métrica | % | Cubierto |",
              "|---|---|---|",
              row("statements", "Sentencias"),
              row("branches", "Ramas"),
              row("functions", "Funciones"),
              row("lines", "Líneas"),
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Verificación de tipos y build de producción
        run: npm run build

  # ─── Pruebas E2E (caja negra) — solo manual, requieren un backend ───────────
  # Secrets necesarios: E2E_API_URL (backend de pruebas, con CORS para
  # http://localhost:5173) y las credenciales E2E_* de .env.e2e.example.
  e2e:
    name: Pruebas E2E (Playwright)
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ secrets.E2E_API_URL }}
      E2E_MANAGER_USER: ${{ secrets.E2E_MANAGER_USER }}
      E2E_MANAGER_PASS: ${{ secrets.E2E_MANAGER_PASS }}
      E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
      E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
      E2E_ADMIN_LOCATION: ${{ secrets.E2E_ADMIN_LOCATION }}
      E2E_CASHIER_USER: ${{ secrets.E2E_CASHIER_USER }}
      E2E_CASHIER_PASS: ${{ secrets.E2E_CASHIER_PASS }}
      E2E_CASHIER_LOCATION: ${{ secrets.E2E_CASHIER_LOCATION }}
      E2E_PRODUCT: ${{ secrets.E2E_PRODUCT }}
      E2E_PRODUCT_PRICE: ${{ secrets.E2E_PRODUCT_PRICE }}
      E2E_PRODUCT_NO_STOCK: ${{ secrets.E2E_PRODUCT_NO_STOCK }}
      E2E_WHATSAPP_APP_SECRET: ${{ secrets.E2E_WHATSAPP_APP_SECRET }}
      E2E_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.E2E_WHATSAPP_PHONE_NUMBER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npm run e2e

      - name: Publicar reporte E2E (capturas, videos y trazas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-results/
          retention-days: 14
